<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>中枢 · Jarvis Demo</title>
<style>
  :root { --bg:#0b0f14; --panel:#131a22; --accent:#2ec4b6; --text:#dce6f0; --dim:#7d8a99; }
  * { box-sizing:border-box; margin:0; padding:0; }
  body { background:var(--bg); color:var(--text); font-family:"Segoe UI",system-ui,"Microsoft YaHei",sans-serif; height:100vh; display:flex; flex-direction:column; }
  header { display:flex; align-items:center; gap:12px; padding:14px 20px; background:var(--panel); border-bottom:1px solid #1f2a35; }
  header h1 { font-size:16px; letter-spacing:2px; }
  header .dot { width:10px; height:10px; border-radius:50%; background:#e5484d; }
  header .dot.ok { background:var(--accent); }
  header .meta { font-size:12px; color:var(--dim); }
  .controls { display:flex; gap:10px; padding:10px 20px; background:var(--panel); border-bottom:1px solid #1f2a35; align-items:center; flex-wrap:wrap; }
  .controls input[type=text], .controls select { background:#0e141b; border:1px solid #24303c; color:var(--text); border-radius:6px; padding:6px 10px; font-size:13px; }
  .tools { padding:6px 20px; background:var(--panel); border-bottom:1px solid #1f2a35; display:flex; gap:8px; flex-wrap:wrap; align-items:center; }
  .tools .label { font-size:11px; color:var(--dim); }
  .tool-chip { font-size:11px; padding:2px 9px; border-radius:10px; border:1px solid #24303c; color:var(--dim); }
  .tool-chip.dynamic { color:var(--accent); border-color:#2a4a46; }
  #chat { flex:1; overflow-y:auto; padding:20px; display:flex; flex-direction:column; gap:14px; }
  .msg { max-width:78%; padding:10px 14px; border-radius:12px; font-size:14px; line-height:1.6; white-space:pre-wrap; word-break:break-word; }
  .msg.user { align-self:flex-end; background:#1d4ed8; color:#fff; border-bottom-right-radius:4px; }
  .msg.assistant { align-self:flex-start; background:var(--panel); border:1px solid #223041; border-bottom-left-radius:4px; }
  .msg.error { align-self:flex-start; background:#3a1520; color:#ff9d9d; border:1px solid #5a2230; }
  .msg-sub { font-size:11px; color:var(--dim); margin-top:5px; }
  .msg.thinking { color:var(--dim); font-style:italic; border:none; background:none; }
  .inputbar { display:flex; gap:10px; padding:14px 20px; background:var(--panel); border-top:1px solid #1f2a35; }
  .inputbar textarea { flex:1; resize:none; background:#0e141b; border:1px solid #24303c; color:var(--text); border-radius:8px; padding:10px 12px; font-size:14px; height:52px; font-family:inherit; }
  .inputbar button { background:var(--accent); color:#04201d; border:none; border-radius:8px; padding:0 22px; font-size:14px; font-weight:600; cursor:pointer; }
  .inputbar button:disabled { opacity:.5; cursor:not-allowed; }
</style>
</head>
<body>
<header>
  <span class="dot" id="dot"></span>
  <h1>中枢 · JARVIS</h1>
  <span class="meta" id="meta">连接中…</span>
</header>
<div class="controls">
  <select id="model"></select>
  <input type="text" id="token" placeholder="Auth Token（未设置鉴权可留空）" style="width:260px">
</div>
<div class="tools" id="toolsPanel"><span class="label">工具加载中…</span></div>
<div id="chat"></div>
<div class="inputbar">
  <textarea id="input" placeholder="问点什么…（支持工具：搜索/天气/日历/提醒等，取决于服务配置）"></textarea>
  <button id="send" onclick="send()">发送</button>
</div>
<script>
const chatEl = document.getElementById('chat');
const inputEl = document.getElementById('input');
const sendBtn = document.getElementById('send');
let history = [];

function headers() {
  const h = { 'Content-Type': 'application/json' };
  const t = document.getElementById('token').value.trim();
  if (t) h['Authorization'] = 'Bearer ' + t;
  return h;
}

function addMsg(role, text, sub) {
  const div = document.createElement('div');
  div.className = 'msg ' + role;
  div.textContent = text;
  if (sub) {
    const s = document.createElement('div');
    s.className = 'msg-sub';
    s.textContent = sub;
    div.appendChild(s);
  }
  chatEl.appendChild(div);
  chatEl.scrollTop = chatEl.scrollHeight;
  return div;
}

async function checkHealth() {
  try {
    const r = await fetch('/healthz');
    const d = await r.json();
    const dot = document.getElementById('dot');
    dot.className = 'dot' + (d.db ? ' ok' : '');
    document.getElementById('meta').textContent =
      (d.db ? '核心在线' : '降级运行（数据库未连接）') + ' · 模型: ' + (d.providers.join(', ') || '无');
  } catch (e) {
    document.getElementById('meta').textContent = '无法连接 core 服务';
  }
}

async function loadModels() {
  try {
    const r = await fetch('/v1/models', { headers: headers() });
    const d = await r.json();
    const sel = document.getElementById('model');
    sel.innerHTML = '';
    for (const m of d.data || []) {
      const o = document.createElement('option');
      o.value = m.id; o.textContent = m.id + (m.detail ? ' (' + m.detail + ')' : '');
      sel.appendChild(o);
    }
  } catch (e) { /* 忽略 */ }
}

async function loadTools() {
  try {
    const r = await fetch('/v1/tools', { headers: headers() });
    const d = await r.json();
    const panel = document.getElementById('toolsPanel');
    panel.innerHTML = '<span class="label">工具（' + (d.count || 0) + '）</span>';
    for (const t of d.tools || []) {
      const chip = document.createElement('span');
      chip.className = 'tool-chip' + (t.source === 'builtin' ? '' : ' dynamic');
      chip.textContent = t.name;
      chip.title = t.source + ': ' + (t.description || '');
      panel.appendChild(chip);
    }
  } catch (e) { /* 忽略 */ }
}

async function send() {
  const text = inputEl.value.trim();
  if (!text) return;
  inputEl.value = '';
  addMsg('user', text);
  history.push({ role: 'user', content: text });
  const thinking = addMsg('thinking', '中枢思考中…');
  sendBtn.disabled = true;
  try {
    const r = await fetch('/v1/chat/completions', {
      method: 'POST',
      headers: headers(),
      body: JSON.stringify({ model: document.getElementById('model').value, messages: history })
    });
    const d = await r.json();
    thinking.remove();
    if (r.ok) {
      const content = d.choices && d.choices[0] && d.choices[0].message.content || '';
      const u = d.usage || {};
      addMsg('assistant', content, '模型: ' + (d.model || '?') + ' · ' + (u.total_tokens || 0) + ' tokens');
      history.push({ role: 'assistant', content });
    } else {
      addMsg('error', '错误: ' + JSON.stringify(d.error || d));
    }
  } catch (e) {
    thinking.remove();
    addMsg('error', '请求失败: ' + e.message);
  }
  sendBtn.disabled = false;
  loadTools();
}

inputEl.addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send(); }
});

checkHealth(); loadModels(); loadTools();
</script>
</body>
</html>
